http:
  port: 8080
  readOnly: false
  # Behind an HTTPS reverse proxy, set the exact browser-visible origin, e.g.:
  # publicOrigin: "https://adminer.example.com"

logger:
  level: "INFO"

etcd:
- name: "LOCAL"
  endpoints:
    - "http://127.0.0.1:23791"
    - "http://127.0.0.1:23792"
    - "http://127.0.0.1:23793"
  superadmin:
    username: root
    password: root@123
    # Production: remove password above and choose exactly one protected source:
    # passwordFile: /run/secrets/etcd-admin-password
    # passwordEnv: ETCD_ADMIN_PASSWORD
  # For a TLS backend, use https:// endpoints and configure:
  # tls:
  #   enabled: true
  #   caFile: /run/secrets/etcd-ca.pem
  #   certFile: /run/secrets/etcd-client.pem
  #   keyFile: /run/secrets/etcd-client-key.pem
  #   serverName: etcd.example.com
