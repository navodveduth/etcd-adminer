name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Isolated etcd RBAC integration tests
        run: sh scripts/test-integration.sh
      - name: Isolated mTLS and caller-isolation tests
        run: ETCD_TEST_TLS=1 sh scripts/test-integration.sh
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Production-bundle browser smoke
        run: npm run test:browser
      - run: npm audit --audit-level=high

# Publishing is intentionally not part of PR/branch validation. Run release
# publishing only from a separately reviewed, trusted release workflow.
